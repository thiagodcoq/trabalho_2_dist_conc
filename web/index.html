<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Sebo</title>
<style>
  body { font-family: sans-serif; max-width: 760px; margin: 20px auto; }
  section { border: 1px solid #ccc; padding: 12px; margin-bottom: 20px; }
  input, button { margin: 3px; padding: 4px; }
  pre { background: #f4f4f4; padding: 8px; white-space: pre-wrap; }
</style>
<script src="config.js"></script>
</head>
<body>
<h1>Sebo</h1>

<section>
  <h2>Comprador</h2>
  <button onclick="listarLivros('listaComprador')">Listar livros</button>
  <br>
  <input id="email" placeholder="seu e-mail" size="28">
  <input id="livroId" placeholder="ID do livro (ex.: L001)">
  <button onclick="pedir()">Pedir livro</button>
  <button onclick="meusPedidos()">Meus pedidos</button>
  <pre id="listaComprador"></pre>
  <pre id="saidaComprador"></pre>
</section>

<section>
  <h2>Colaborador</h2>
  <button onclick="listarLivros('listaColab')">Listar estoque</button>
  <br>
  <input id="chegadaLivro" placeholder="ID do livro">
  <input id="chegadaQtd" type="number" min="1" placeholder="quantidade">
  <button onclick="chegada()">Registrar chegada</button>
  <pre id="listaColab"></pre>
  <pre id="saidaColab"></pre>
</section>

<script>
async function chamar(url, opcoes) {
  try {
    const r = await fetch(url, opcoes);
    const dados = await r.json();
    return { ok: r.ok, status: r.status, dados };
  } catch (e) {
    return { ok: false, status: 0, dados: { erro: "Falha de comunicação: " + e } };
  }
}

async function listarLivros(destino) {
  const r = await chamar(URLS.consulta + "?tipo=livros");
  document.getElementById(destino).textContent = r.ok
    ? r.dados.livros.map(l => `${l.livro_id}  ${l.titulo} - ${l.autor}  R$ ${l.preco}  (estoque: ${l.quantidade})`).join("\n")
    : "Erro " + r.status + ": " + JSON.stringify(r.dados);
}

async function pedir() {
  const email = document.getElementById("email").value.trim();
  const livro_id = document.getElementById("livroId").value.trim();
  const r = await chamar(URLS.pedido, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ email, livro_id })
  });
  document.getElementById("saidaComprador").textContent = r.ok
    ? `Pedido ${r.dados.pedido_id} [${r.dados.status}]: ${r.dados.mensagem}`
    : "Erro " + r.status + ": " + (r.dados.erro || JSON.stringify(r.dados));
}

async function meusPedidos() {
  const email = document.getElementById("email").value.trim();
  const r = await chamar(URLS.consulta + "?tipo=pedidos&email=" + encodeURIComponent(email));
  document.getElementById("saidaComprador").textContent = r.ok
    ? r.dados.pedidos.map(p => `${p.pedido_id}  livro ${p.livro_id}  ${p.status}`).join("\n")
    : "Erro " + r.status + ": " + (r.dados.erro || JSON.stringify(r.dados));
}

async function chegada() {
  const livro_id = document.getElementById("chegadaLivro").value.trim();
  const quantidade = parseInt(document.getElementById("chegadaQtd").value, 10);
  const r = await chamar(URLS.chegada, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ livro_id, quantidade })
  });
  document.getElementById("saidaColab").textContent = r.ok
    ? `Chegada registrada. Estoque de ${r.dados.livro_id}: ${r.dados.quantidade}`
    : "Erro " + r.status + ": " + (r.dados.erro || JSON.stringify(r.dados));
}
</script>
</body>
</html>
